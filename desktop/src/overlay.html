<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title data-texte="overlayTitre">Overlay · Win or Workout</title>
<style>
  /* Le fond de la page doit rester réellement transparent : c'est lui qu'on
     voit « à travers » l'overlay. Seule la pastille est peinte. */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  .pastille {
    position: relative;
    margin: 0;
    padding: 10px 13px;
    border-radius: 12px;
    background: rgba(20, 23, 28, 0.92);
    border: 1px solid rgba(255, 180, 84, 0.45);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 22px rgba(255, 138, 61, 0.14);
    color: #ECEFF4;
  }

  .titre {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(152, 162, 176, 0.75);
  }

  .point {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2FD98A;
    box-shadow: 0 0 6px #2FD98A;
    animation: battement 1.4s ease-in-out infinite;
  }
  @keyframes battement { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }

  /* Le compteur qui défile est la preuve que l'overlay est VIVANT et pas une
     image figée : s'il avance, le rendu passe bien par-dessus le jeu. */
  .compteur {
    margin-top: 5px;
    font-size: 27px;
    font-weight: 700;
    line-height: 1.05;
    color: #FFB454;
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }

  .etat {
    margin-top: 6px;
    font-size: 10.5px;
    line-height: 1.45;
    color: rgba(236, 239, 244, 0.55);
  }

  /* Deux temps, deux rôles : la partie en cours en grand, la soirée en appui.
     Aucun des deux ne compte les menus. */
  .sous-compteur {
    margin-top: 2px;
    font-size: 10px;
    color: rgba(236, 239, 244, 0.4);
    font-variant-numeric: tabular-nums;
  }

  .lignes {
    margin-top: 7px;
    padding-top: 6px;
    border-top: 1px solid rgba(152, 162, 176, 0.16);
    display: grid;
    gap: 3px;
  }

  .ligne {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    font-size: 10.5px;
    color: rgba(236, 239, 244, 0.5);
  }

  .ligne b {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 12px;
    color: #ECEFF4;
  }

  .ligne b.dette { color: #FF8A3D; }
  .ligne b.gagne { color: #2FD98A; }

  /* Un état de lecture n'est pas un chiffre : il ne prend pas l'allure d'un
     chiffre. Sans ça, « écran noir » s'affiche en gras monospace, comme une
     valeur relevée. */
  .ligne b.attente {
    font-family: inherit;
    font-weight: 500;
    font-size: 10px;
    color: rgba(236, 239, 244, 0.5);
  }

  .jeu { color: #6E9BFF; }
  .jeu.actif { color: #2FD98A; }

  /* Mode placement : la pastille cesse d'être un simple affichage le temps
     qu'on la pose. Le liseré et la consigne disent que ce moment est
     particulier — sans quoi rien ne distinguerait ce mode du fonctionnement
     normal, où le clic passe au travers. */
  body.placement .pastille {
    border-color: rgba(47, 217, 138, 0.85);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 26px rgba(47, 217, 138, 0.3);
    -webkit-app-region: drag;
    cursor: move;
  }

  .consigne {
    display: none;
    margin-top: 7px;
    padding-top: 6px;
    border-top: 1px solid rgba(47, 217, 138, 0.3);
    font-size: 9.5px;
    line-height: 1.5;
    color: #2FD98A;
  }
  body.placement .consigne { display: block; }

  /*
     Retour de capture, posé PAR-DESSUS le bas de la pastille.
     Allonger la pastille pour un message de deux secondes et demie la
     rendrait plus encombrante en permanence — et la fenêtre est en
     `overflow: hidden` : ce qui dépasse de ses 210 pixels serait coupé sans
     un mot, ce qui est déjà arrivé une fois ici.
  */
  .capture {
    display: none;
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.72rem;
    line-height: 1.35;
    text-align: center;
    word-break: break-all;
    backdrop-filter: blur(2px);
  }
  .capture.ok    { display: block; background: rgba(47,217,138,0.15); color: #2FD98A; }
  .capture.echec { display: block; background: rgba(255,77,46,0.15);  color: #FF8A3D; }

  /* La question posée par-dessus l'écran de chargement.
     Elle REMPLACE la pastille au lieu de s'ajouter à côté : deux blocs
     concurrents par-dessus un jeu, c'est un de trop, et celui qui demande
     quelque chose doit être le seul à parler. */
  .question { display: none; }
  body.demande .pastille { display: none; }
  body.demande .question { display: block; }
  .question-texte {
    font-size: 13px; line-height: 1.35; color: #ECEFF4;
    margin-bottom: 10px; font-weight: 600;
  }
  .question-boutons { display: flex; gap: 8px; }
  .question-boutons button {
    flex: 1; padding: 8px 10px; border-radius: 6px; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 700;
    border: 1px solid rgba(152,162,176,0.35);
    background: rgba(152,162,176,0.12); color: #ECEFF4;
  }
  .question-boutons button.oui {
    background: #FF5A2E; border-color: #FF5A2E; color: #0C0E11;
  }
</style>
</head>
<body>
  <div class="pastille">
    <div class="titre">
      <span class="point"></span>
      <span>Win // Workout</span>
    </div>

    <!-- Le temps de la partie en cours a disparu : le jeu l'affiche déjà, et
         le répéter ne fait qu'occuper la place. Reste le seul chiffre que le
         jeu ne donne pas — le temps joué sur la soirée, menus exclus. -->
    <div class="compteur" id="compteur">--:--</div>
    <div class="sous-compteur" id="sous-compteur">joué ce soir, hors menus</div>

    <div class="etat">
      <span class="jeu" id="jeu">pas de partie</span>
    </div>

    <div class="lignes">
      <div class="ligne" id="ligne-kda"><span id="kda-titre">KDA</span><b id="kda">–</b></div>
      <!-- Deux nombres plutôt qu'un : à mi-partie l'issue n'est pas connue, et
           une victoire ne coûte pas la même chose qu'une défaite. Annoncer un
           seul chiffre reviendrait à parier à la place du joueur. -->
      <div class="ligne" id="ligne-gagne"><span data-texte="overlaySiGagne">Si gagné</span><b class="gagne" id="dette-v">–</b></div>
      <div class="ligne" id="ligne-perdu"><span data-texte="overlaySiPerdu">Si perdu</span><b class="dette" id="dette-d">–</b></div>
      <div class="ligne" id="ligne-attente" style="display:none"><span data-texte="overlayEnAttente">En attente</span><b class="dette" id="dette-due">–</b></div>
    </div>

    <div class="capture" id="capture"></div>

    <div class="consigne" data-texte="overlayConsigne">Traîne-moi où tu veux, puis « Terminer ».</div>
  </div>

  <!-- Les mots viennent de la PAGE, qui connaît le compte et ses six langues.
       Rien n'est écrit en dur ici : c'est la règle du projet, et la coquille
       Electron s'était déjà fait prendre à parler français à tout le monde. -->
  <div class="pastille question" id="question" role="dialog" aria-modal="true">
    <div class="titre">
      <span class="point"></span>
      <span>Win // Workout</span>
    </div>
    <div class="question-texte" id="question-texte"></div>
    <div class="question-boutons">
      <button type="button" class="oui" id="question-oui"></button>
      <button type="button" id="question-non"></button>
    </div>
  </div>

<script>
  // Le compteur porte le temps joué sur la soirée, et lui seul.
  //
  // Il a d'abord compté depuis l'ouverture de la fenêtre — la preuve que
  // l'overlay était vivant, à l'époque où il fallait vérifier qu'il se
  // dessinait par-dessus le jeu. Puis le temps de la partie en cours, une fois
  // cette question tranchée. Mais le jeu affiche déjà son propre chrono de
  // partie : le répéter n'apprenait rien. Le cumul de la soirée, lui, n'existe
  // nulle part ailleurs — et il ne compte que le temps réellement joué, jamais
  // les menus ni les files d'attente.
  /**
   * Les mots de la pastille.
   *
   * Le HTML porte le français : c'est ce qui s'affiche si le canal ne dit
   * jamais rien, et c'est un repli tenable — la pastille reste lisible. Les
   * valeurs reçues le remplacent dès le premier envoi, qui précède le premier
   * état, pour qu'elle ne se réécrive pas sous les yeux du joueur.
   */
  let T = {};
  for (const el of document.querySelectorAll("[data-texte]")) {
    T[el.dataset.texte] = el.textContent;
  }
  T.overlayJoue = document.getElementById("sous-compteur").textContent;
  T.overlayJeuOuvert = "jeu ouvert ce soir, menus compris";
  T.overlayPasDePartie = document.getElementById("jeu").textContent;
  T.overlayPartieEnCours = "partie en cours";
  T.overlayEscouade = "Escouade";

  window.overlayLOW?.onTextes?.((recus) => {
    if (!recus) return;
    T = { ...T, ...recus };
    for (const el of document.querySelectorAll("[data-texte]")) {
      const valeur = T[el.dataset.texte];
      if (valeur) el.textContent = valeur;
    }
    // Ce qui n'est pas dans le HTML se réécrit au prochain état ; celui-ci
    // arrive dans la foulée, et de toute façon toutes les deux secondes.
  });

  const compteur = document.getElementById("compteur");
  const jeu = document.getElementById("jeu");
  const sousCompteur = document.getElementById("sous-compteur");
  const capture = document.getElementById("capture");
  const ligneKda = document.getElementById("ligne-kda");
  const kdaTitre = document.getElementById("kda-titre");
  const ligneGagne = document.getElementById("ligne-gagne");
  const lignePerdu = document.getElementById("ligne-perdu");
  const kda = document.getElementById("kda");
  const detteV = document.getElementById("dette-v");
  const detteD = document.getElementById("dette-d");
  const detteDue = document.getElementById("dette-due");
  const ligneAttente = document.getElementById("ligne-attente");

  const mmss = (s) => {
    const n = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(n / 3600);
    const m = Math.floor((n % 3600) / 60);
    const sec = n % 60;
    return h > 0
      ? `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`
      : `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  };

  /**
   * L'horloge du jeu n'est relevée que toutes les cinq secondes. S'en contenter
   * donnait un chronomètre qui sautait de cinq en cinq, ce qu'on voit tout de
   * suite. On avance donc d'une seconde localement entre deux relevés, et
   * chaque relevé remet le compteur à l'heure : la référence reste l'horloge du
   * jeu, l'interpolation ne fait que combler l'intervalle.
   */
  let enPartie = false;
  let sessionSec = 0;
  /** Instant de la dernière capture affichée, pour ne pas la rejouer. */
  let dernierePose = 0;
  let minuteurCapture = null;

  function afficherTemps() {
    // Hors partie le total tient : c'est ce qui a été joué, pas un chrono en
    // cours. Il ne repart que sur une partie suivante.
    compteur.textContent = sessionSec > 0 ? mmss(sessionSec) : "--:--";
  }

  setInterval(() => {
    if (!enPartie) return;
    sessionSec += 1;
    afficherTemps();
  }, 1000);

  if (window.overlayLOW && window.overlayLOW.onEtat) {
    window.overlayLOW.onEtat((etat) => {
      enPartie = !!(etat && etat.enPartie);
      if (typeof etat.sessionSec === "number") sessionSec = etat.sessionSec;
      afficherTemps();

      jeu.textContent = enPartie ? (etat.jeu || T.overlayPartieEnCours) : T.overlayPasDePartie;
      jeu.className = enPartie ? "jeu actif" : "jeu";

      /**
       * Trois lignes n'existent que si le jeu se raconte.
       *
       * Chez Apex, rien n'expose le KDA ni l'issue en cours de partie. Les
       * laisser à « – » donnerait une pastille dont trois lignes sur cinq
       * n'attendent rien : un tiret se lit comme « ça arrive », et on
       * attendrait alors indéfiniment. On les retire, et le compteur dit ce
       * qu'il compte vraiment.
       */
      const avecReleve = !enPartie || etat.releve !== false;
      /**
       * Les chiffres lus à l'écran remplacent le KDA sur un jeu qui n'expose
       * rien. La ligne existe alors, même sans relevé d'API — c'est la lecture
       * de l'image qui la remplit. Les deux projections restent masquées : sans
       * le classement, il n'y a rien d'honnête à annoncer.
       */
      const apex = etat.apex;
      ligneKda.style.display = avecReleve || apex ? "flex" : "none";
      for (const l of [ligneGagne, lignePerdu]) {
        l.style.display = avecReleve ? "flex" : "none";
      }
      sousCompteur.textContent = avecReleve ? T.overlayJoue : T.overlayJeuOuvert;

      const s = etat.score;
      if (apex) {
        // Le cartouche compte l'escouade entière : le libellé le dit, sinon
        // on prend les frags des coéquipiers pour les siens.
        kdaTitre.textContent = T.overlayEscouade;
        kda.style.opacity = "1";
        if (apex.attente) {
          /**
           * La lecture qui n'a rien donné le dit.
           *
           * Cette ligne restait cachée tant qu'aucun chiffre n'était lu : une
           * pastille vide, sans un mot, pendant qu'une boucle tournait toutes
           * les cinq secondes. Rien ne distinguait « ça arrive » de « la
           * lecture ne marche pas », et il n'y avait aucun moyen de le savoir
           * sans ouvrir le journal.
           */
          kda.className = "attente";
          kda.textContent = apex.attente;
        } else {
          kda.className = "";
          const d = apex.degats === null || apex.degats === undefined ? "–" : apex.degats;
          kda.textContent = `${apex.eliminations} / ${d}`;
          // Un chiffre sur lequel les modes de lecture ont divergé ne se donne
          // pas du même air qu'un chiffre sûr.
          kda.style.opacity = apex.sur ? "1" : "0.55";
        }
      } else {
        kdaTitre.textContent = "KDA";
        kda.style.opacity = "1";
        kda.className = "";
        kda.textContent = s ? `${s.kills} / ${s.deaths} / ${s.assists}` : "–";
      }

      // `dette` porte désormais la projection de la partie en cours, calculée
      // par la page avec les mêmes règles que l'enregistrement final. Avant,
      // c'était la dette de session — nulle tant qu'aucune session n'était
      // lancée, ce qui affichait zéro pendant toute la partie.
      // Les quantités arrivent déjà formatées : c'est la page qui connaît
      // l'exercice choisi, et « 30 s » de boxe n'est pas « 30 pompes ».
      const d = etat.dette;
      const texte = (v) => (v ? String(v) : "–");
      detteV.textContent = texte(d && d.victoire);
      detteD.textContent = texte(d && d.defaite);

      /**
       * Retour de capture d'écran.
       *
       * `pose` porte l'instant de la capture : sans lui, un état repoussé pour
       * une autre raison — la dette qui change, une partie qui démarre —
       * rallumerait le message déjà éteint, puisque l'état est fusionné et non
       * remplacé.
       */
      if (etat.capture && etat.capture.pose !== dernierePose) {
        dernierePose = etat.capture.pose;
        capture.textContent = etat.capture.texte;
        capture.className = `capture ${etat.capture.ok ? "ok" : "echec"}`;
        clearTimeout(minuteurCapture);
        minuteurCapture = setTimeout(() => { capture.className = "capture"; }, 2500);
      }

      // L'effort déjà dû, hors partie en cours : il ne concerne que les
      // exercices comptés en temps, et n'a rien à afficher sans eux.
      const due = d && d.enAttente;
      ligneAttente.style.display = due ? "flex" : "none";
      if (due) detteDue.textContent = String(due);
    });
  }

  // Mode placement : la classe suffit, tout le reste est dans la feuille de
  // style. C'est le processus principal qui rend réellement la fenêtre
  // attrapable — ici on ne fait que le montrer.
  if (window.overlayLOW && window.overlayLOW.onPlacement) {
    window.overlayLOW.onPlacement((actif) => {
      document.body.classList.toggle("placement", actif);
    });
  }

  /**
   * La question posée par-dessus le jeu.
   *
   * `null` la ferme sans réponse — c'est ce qui arrive quand la partie
   * commence pour de bon sans qu'on ait cliqué : on ne va pas retenir
   * quelqu'un qui joue.
   *
   * Une seule réponse part par question : `repondue` empêche qu'un double clic
   * ou un clic sur les deux boutons en envoie deux, ce que le processus
   * principal traiterait comme deux réponses contradictoires.
   */
  if (window.overlayLOW && window.overlayLOW.onQuestion) {
    const bloc = document.getElementById("question");
    const texte = document.getElementById("question-texte");
    const oui = document.getElementById("question-oui");
    const non = document.getElementById("question-non");
    let idCourant = null;
    let repondue = false;

    const fermer = () => {
      idCourant = null;
      document.body.classList.remove("demande");
    };

    const repondre = (valeur) => {
      if (idCourant === null || repondue) return;
      repondue = true;
      window.overlayLOW.repondre(idCourant, valeur);
      fermer();
    };

    oui.addEventListener("click", () => repondre(true));
    non.addEventListener("click", () => repondre(false));

    window.overlayLOW.onQuestion((q) => {
      if (!q) { fermer(); return; }
      idCourant = q.id;
      repondue = false;
      texte.textContent = q.texte || "";
      oui.textContent = q.oui || "";
      non.textContent = q.non || "";
      document.body.classList.add("demande");
      // Le premier bouton prend le focus : la fenêtre est rendue focalisable
      // le temps de la question, et une question qu'on ne peut pas traverser
      // au clavier n'est pas une question pour tout le monde.
      try { oui.focus(); } catch { /* la fenêtre n'a pas encore le focus */ }
    });

    bloc.addEventListener("keydown", (e) => {
      // Échap vaut « non ». Refuser est le choix sûr : il ne démarre rien.
      if (e.key === "Escape") repondre(false);
    });
  }
</script>
</body>
</html>
