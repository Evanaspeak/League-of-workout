<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay — Win or Workout</title>
<style>
  /* Le fond de la page doit rester réellement transparent : c'est lui qu'on
     voit « à travers » l'overlay. Seule la pastille est peinte. */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  .pastille {
    margin: 0;
    padding: 10px 13px;
    border-radius: 12px;
    background: rgba(20, 23, 28, 0.92);
    border: 1px solid rgba(255, 180, 84, 0.45);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 22px rgba(255, 138, 61, 0.14);
    color: #ECEFF4;
  }

  .titre {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(152, 162, 176, 0.75);
  }

  .point {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2FD98A;
    box-shadow: 0 0 6px #2FD98A;
    animation: battement 1.4s ease-in-out infinite;
  }
  @keyframes battement { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }

  /* Le compteur qui défile est la preuve que l'overlay est VIVANT et pas une
     image figée : s'il avance, le rendu passe bien par-dessus le jeu. */
  .compteur {
    margin-top: 5px;
    font-size: 27px;
    font-weight: 700;
    line-height: 1.05;
    color: #FFB454;
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }

  .etat {
    margin-top: 6px;
    font-size: 10.5px;
    line-height: 1.45;
    color: rgba(236, 239, 244, 0.55);
  }

  /* Deux temps, deux rôles : la partie en cours en grand, la soirée en appui.
     Aucun des deux ne compte les menus. */
  .sous-compteur {
    margin-top: 2px;
    font-size: 10px;
    color: rgba(236, 239, 244, 0.4);
    font-variant-numeric: tabular-nums;
  }

  .lignes {
    margin-top: 7px;
    padding-top: 6px;
    border-top: 1px solid rgba(152, 162, 176, 0.16);
    display: grid;
    gap: 3px;
  }

  .ligne {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    font-size: 10.5px;
    color: rgba(236, 239, 244, 0.5);
  }

  .ligne b {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 12px;
    color: #ECEFF4;
  }

  .ligne b.dette { color: #FF8A3D; }

  .jeu { color: #6E9BFF; }
  .jeu.actif { color: #2FD98A; }

  .aide {
    margin-top: 7px;
    padding-top: 6px;
    border-top: 1px solid rgba(152, 162, 176, 0.16);
    font-size: 9px;
    color: rgba(236, 239, 244, 0.32);
  }
</style>
</head>
<body>
  <div class="pastille">
    <div class="titre">
      <span class="point"></span>
      <span>Win // Workout</span>
    </div>

    <div class="compteur" id="compteur">--:--</div>
    <div class="sous-compteur" id="session">soirée : 00:00</div>

    <div class="etat">
      <span class="jeu" id="jeu">pas de partie</span>
    </div>

    <div class="lignes">
      <div class="ligne"><span>KDA</span><b id="kda">–</b></div>
      <div class="ligne"><span>À payer</span><b class="dette" id="dette">–</b></div>
    </div>

    <div class="aide">Ctrl + Maj + O pour masquer</div>
  </div>

<script>
  // Le compteur mesure la partie en cours, et rien d'autre.
  //
  // Il comptait auparavant depuis l'ouverture de la fenêtre : c'était la preuve
  // que l'overlay était vivant, à l'époque où il fallait vérifier qu'il
  // s'affichait par-dessus le jeu. Cette question est tranchée, et le chrono
  // affichait alors deux heures pour une partie qui venait de commencer.
  const compteur = document.getElementById("compteur");
  const session = document.getElementById("session");
  const jeu = document.getElementById("jeu");
  const kda = document.getElementById("kda");
  const dette = document.getElementById("dette");

  const mmss = (s) => {
    const n = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(n / 3600);
    const m = Math.floor((n % 3600) / 60);
    const sec = n % 60;
    return h > 0
      ? `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`
      : `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  };

  /**
   * L'horloge du jeu n'est relevée que toutes les cinq secondes. S'en contenter
   * donnait un chronomètre qui sautait de cinq en cinq, ce qu'on voit tout de
   * suite. On avance donc d'une seconde localement entre deux relevés, et
   * chaque relevé remet les compteurs à l'heure : la référence reste l'horloge
   * du jeu, l'interpolation ne fait que combler l'intervalle.
   */
  let enPartie = false;
  let partieSec = 0;
  let sessionSec = 0;

  function afficherTemps() {
    compteur.textContent = enPartie ? mmss(partieSec) : "--:--";
    session.textContent = `soirée : ${mmss(sessionSec)}`;
  }

  setInterval(() => {
    if (!enPartie) return;
    partieSec += 1;
    sessionSec += 1;
    afficherTemps();
  }, 1000);

  if (window.overlayLOW && window.overlayLOW.onEtat) {
    window.overlayLOW.onEtat((etat) => {
      enPartie = !!(etat && etat.enPartie);
      if (typeof etat.partieSec === "number") partieSec = etat.partieSec;
      if (typeof etat.sessionSec === "number") sessionSec = etat.sessionSec;
      afficherTemps();

      jeu.textContent = enPartie ? (etat.jeu || "partie en cours") : "pas de partie";
      jeu.className = enPartie ? "jeu actif" : "jeu";

      const s = etat.score;
      kda.textContent = s ? `${s.kills} / ${s.deaths} / ${s.assists}` : "–";
      dette.textContent = etat.dette == null ? "–" : String(etat.dette);
    });
  }
</script>
</body>
</html>
