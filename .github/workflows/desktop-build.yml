name: Build Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier. Vide = celle de desktop/package.json."
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # La version vient du fichier qui la porte déjà. Une valeur saisie à la
      # main pouvait ne pas correspondre à ce qui venait d'être compilé : un
      # lancement sans saisie retombait sur « 0.1.0 » et publiait l'installeur
      # neuf dans la toute première release, où plus personne ne regarde.
      - name: Version à publier
        id: version
        shell: bash
        # La saisie passe par l'environnement, jamais par interpolation dans le
        # script : interpolée, elle serait remplacée AVANT l'exécution, et des
        # métacaractères shell deviendraient du code. Il faut déjà le droit
        # d'écriture sur le dépôt pour déclencher ce workflow, donc l'enjeu est
        # faible — mais c'est le motif exact de l'injection, autant ne pas
        # l'écrire.
        env:
          VERSION_SAISIE: ${{ inputs.version }}
        run: |
          fichier="$(node -p "require('./package.json').version")"
          echo "valeur=${VERSION_SAISIE:-$fichier}" >> "$GITHUB_OUTPUT"

      - name: Build NSIS installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('desktop-v{0}', steps.version.outputs.valeur) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('Win or Workout v{0}', steps.version.outputs.valeur) || format('Win or Workout {0}', github.ref_name) }}
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          generate_release_notes: false
          body: |
            ## Téléchargement

            Installez l'application sur **Windows 10 / 11**.

            1. Téléchargez le fichier `.exe` ci-dessous
            2. Lancez l'installeur et suivez les étapes
            3. Connectez-vous avec votre compte Win or Workout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
