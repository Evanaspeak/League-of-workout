# Les envois programmés : rappel du matin, relance des absents, bilan de la
# semaine.
#
# Une soirée qui finit à deux heures laisse une dette que personne ne paie
# avant d'aller dormir, et le rappel de seuil est déjà parti la veille, au
# milieu d'une partie. Celui-ci arrive le lendemain, à une heure où on peut
# réellement faire quelque chose.
#
# Il DEMANDE à tourner toutes les heures parce que les comptes ne sont pas tous
# dans le même fuseau : c'est la route qui regarde, à chaque passage, chez qui
# c'est le matin. Un compte dont le fuseau est inconnu n'est jamais notifié —
# envoyer « bonjour » à trois heures du matin est pire que ne rien envoyer.
#
# Il ne l'obtient pas. Relevé sur huit jours : trois à six passages par jour, à
# des heures imprévisibles, et jamais à celle qu'il fallait — le `schedule` de
# GitHub Actions est au mieux disant, il décale et il saute. Les routes visent
# donc une FENÊTRE (neuf heures à midi local) et retiennent ce qui est déjà
# parti, plutôt qu'une heure exacte qu'on ne touche presque jamais.
#
# Ça rend le système tolérant ; ça ne le rend pas ponctuel. Trois passages par
# jour restent une loterie à trois cases sur vingt-quatre. Un déclencheur
# fiable — les tâches planifiées de Vercel appellent les mêmes adresses avec le
# même secret — est une décision d'infrastructure, notée dans docs/lancement.md.
#
# Ce travail ne CRIE JAMAIS. Il tourne toutes les heures : un échec y vaut
# vingt-quatre courriels par jour, tous identiques. Quand le site va mal, c'est
# la supervision qui le dit, une fois, et c'est la seule à le dire — trois
# travaux qui constatent la même panne écrivent trois fois la même chose. Ici,
# on note et on passe.
#
# Deux secrets à poser dans le dépôt (Settings → Secrets → Actions) :
#   SITE_URL       adresse publique du site (https://winorworkout.com)
#   RAPPEL_SECRET  la même valeur que la variable d'environnement du même nom
#                  côté Vercel. Sans elle, la route refuse tout le monde.
name: Envois programmés

on:
  schedule:
    # À la minute 12 : les heures rondes sont encombrées et GitHub y décale
    # les travaux, ce qui décalerait le rappel d'un temps imprévisible.
    - cron: "12 * * * *"
  workflow_dispatch:

concurrency:
  group: envois-programmes
  cancel-in-progress: false

jobs:
  rappeler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: ${{ secrets.SITE_URL }}
      SECRET: ${{ secrets.RAPPEL_SECRET }}
    steps:
      # Les secrets absents ne sont pas une panne : ce sont des secrets pas
      # encore posés. Échouer ici enverrait un courriel d'échec toutes les
      # heures, vingt-quatre par jour, jusqu'à ce que quelqu'un cède et coupe
      # le travail — c'est-à-dire l'inverse de ce qu'on veut. On le dit une
      # fois dans le journal, et on s'arrête là.
      #
      # La sauvegarde, elle, échoue bruyamment quand ses secrets manquent, et
      # c'est volontaire : une sauvegarde qui n'existe pas doit se voir.
      - name: Vérifier les secrets
        id: secrets
        run: |
          if [ -z "$SITE" ] || [ -z "$SECRET" ]; then
            echo "::notice::SITE_URL ou RAPPEL_SECRET absent — aucun envoi."
            echo "prets=non" >> "$GITHUB_OUTPUT"
          else
            echo "prets=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Déclencher les envois
        if: steps.secrets.outputs.prets == 'oui'
        run: |
          set -o pipefail
          reponse=$(mktemp)
          code=$(curl -sS -o "$reponse" -w '%{http_code}' \
            -X POST "$SITE/api/push/programme" \
            -H "x-rappel-secret: $SECRET" \
            --max-time 60) || code=000

          echo "HTTP $code"
          cat "$reponse"; echo

          # 000 = curl n'a pas abouti. Le distinguer d'une réponse du serveur :
          # confondre les deux rendait la branche « site injoignable »
          # inatteignable dans la supervision, et l'erreur y a vécu longtemps.
          # Noté, pas crié : voir l'en-tête. La supervision, elle, verra la
          # même panne et la signalera une fois.
          if [ "$code" = "000" ]; then
            echo "::warning::Site injoignable — aucun rappel envoyé."; exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::warning::La route a répondu $code — aucun rappel envoyé."; exit 0
          fi

          # Zéro envoi n'est pas une erreur : à cette heure-ci, il n'y a
          # peut-être personne au matin qui doive quelque chose.
          jq -e '.envoyes >= 0' < "$reponse" > /dev/null \
            || echo "::warning::Réponse inattendue de la route."

      - name: Bilan de la semaine
        if: steps.secrets.outputs.prets == 'oui'
        run: |
          set -o pipefail
          reponse=$(mktemp)
          code=$(curl -sS -o "$reponse" -w '%{http_code}' \
            -X POST "$SITE/api/mail/hebdo" \
            -H "x-rappel-secret: $SECRET" \
            --max-time 120) || code=000

          echo "HTTP $code"
          cat "$reponse"; echo

          if [ "$code" = "000" ]; then
            echo "::warning::Site injoignable — aucun bilan envoyé."; exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::warning::La route a répondu $code — aucun bilan envoyé."; exit 0
          fi
          # Le bilan ne part que le lundi, à neuf heures locales : vingt-trois
          # exécutions sur vingt-quatre n'envoient rien, et c'est normal.
          jq -e '.envoyes >= 0' < "$reponse" > /dev/null \
            || echo "::warning::Réponse inattendue de la route."
