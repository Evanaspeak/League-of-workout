# Les tests ne servent que s'ils tournent sans qu'on y pense.
#
# Ils sont conçus pour ne dépendre de rien : base et session sont doublées,
# donc aucune variable d'environnement, aucun PostgreSQL, aucun secret. Le
# poste de travail et le serveur d'intégration exécutent exactement la même
# commande.
name: Tests

# Une exécution par changement, pas deux.
#
# Le travail se fait sur une branche puis se fusionne aussitôt dans `main` :
# avec `branches: ["**"]`, chaque changement déclenchait deux exécutions, donc
# deux courriels quand ça cassait. Vingt-cinq versions rouges d'affilée en ont
# fait cinquante en une nuit. `main` et les demandes de fusion suffisent, et
# `workflow_dispatch` reste là pour éprouver une branche à la main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une poussée qui en suit une autre de près annule la précédente : une
# exécution annulée n'envoie pas de courriel, et le code qu'elle testait est
# de toute façon contenu dans la suivante.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le client Prisma est généré, pas versionné : sans lui, la compilation
      # ne trouve pas les types des modèles.
      - run: npx prisma generate

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --ci

  parcours:
    # Les tests de bout en bout ne peuvent pas se passer d'une base ni d'un
    # navigateur : ils vivent donc dans un travail séparé, pour que l'échec
    # d'un parcours reste distinguable de l'échec d'un test unitaire.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow
          POSTGRES_PASSWORD: wow
          POSTGRES_DB: wow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wow:wow@localhost:5432/wow
      DIRECT_URL: postgresql://wow:wow@localhost:5432/wow
      AUTH_SECRET: integration-continue-non-secret-0000000000
      AUTH_URL: http://127.0.0.1:3311
      NEXTAUTH_URL: http://127.0.0.1:3311
      AUTH_TRUST_HOST: "true"
      E2E_PORT: "3311"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # La base se monte par les MIGRATIONS, comme en production.
      #
      # Elle se montait par un diff du schéma, parce que l'historique n'était
      # pas rejouable depuis zéro : aucune migration ne créait « User ». Le
      # raccourci cachait le défaut au lieu de le signaler — les parcours
      # passaient au vert sur une base qu'aucune reprise après sinistre
      # n'aurait pu reconstruire. Depuis le socle, `migrate deploy` part d'une
      # base vide, et c'est ici que ça se vérifie à chaque poussée.
      - name: Monter la base par les migrations
        run: npx prisma migrate deploy

      # Et le résultat doit correspondre au schéma, sans quoi les migrations
      # construisent autre chose que ce que le code attend. Un diff vide est la
      # seule preuve qui vaille.
      # Trois issues, et il faut les distinguer : identique, différent, ou le
      # contrôle lui-même en panne. La première version écrivait
      # `... --script | grep ... || true` : `--from-url` a été retiré de
      # Prisma 7, la commande sortait en erreur, grep ne recevait rien, l'écart
      # était vide et l'étape passait au vert. Un contrôle qui ne sait pas
      # échouer ne contrôle rien — celui-ci n'a jamais rien vérifié.
      #
      # `--exit-code` sépare les trois cas : 0 identique, 2 différent, 1 panne.
      - name: Vérifier que la base correspond au schéma
        run: |
          set -uo pipefail
          sortie=$(npx prisma migrate diff \
            --from-config-datasource --to-schema ./prisma/schema.prisma \
            --script --exit-code 2>&1)
          code=$?
          if [ "$code" = "0" ]; then exit 0; fi
          if [ "$code" = "2" ]; then
            echo "::error::La base montée par les migrations diffère du schéma."
          else
            echo "::error::Le contrôle de schéma n'a pas pu tourner (code $code)."
          fi
          echo "$sortie"
          exit 1

      - run: npm run build

      - name: Installer le navigateur
        run: npx playwright install --with-deps chromium

      - name: Parcours
        run: npm run e2e

      # L'accessibilité se mesure, elle ne se devine pas. Sans jeton de session
      # le script s'en tient aux pages publiques, ce qui suffit : les écrans
      # connectés partagent les mêmes composants et les mêmes couleurs.
      - name: Accessibilité
        run: |
          npx next start -p 3311 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3311/cgu > /dev/null && break
            sleep 1
          done
          npm run a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-parcours
          path: |
            playwright-report/
            test-results/
          retention-days: 7
