# Les tests ne servent que s'ils tournent sans qu'on y pense.
#
# Ils sont conçus pour ne dépendre de rien : base et session sont doublées,
# donc aucune variable d'environnement, aucun PostgreSQL, aucun secret. Le
# poste de travail et le serveur d'intégration exécutent exactement la même
# commande.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le client Prisma est généré, pas versionné : sans lui, la compilation
      # ne trouve pas les types des modèles.
      - run: npx prisma generate

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --ci

  parcours:
    # Les tests de bout en bout ne peuvent pas se passer d'une base ni d'un
    # navigateur : ils vivent donc dans un travail séparé, pour que l'échec
    # d'un parcours reste distinguable de l'échec d'un test unitaire.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow
          POSTGRES_PASSWORD: wow
          POSTGRES_DB: wow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wow:wow@localhost:5432/wow
      DIRECT_URL: postgresql://wow:wow@localhost:5432/wow
      AUTH_SECRET: integration-continue-non-secret-0000000000
      AUTH_URL: http://127.0.0.1:3311
      NEXTAUTH_URL: http://127.0.0.1:3311
      AUTH_TRUST_HOST: "true"
      E2E_PORT: "3311"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # Le schéma est posé à partir du modèle plutôt que par les migrations :
      # l'historique de migrations n'est pas rejouable depuis zéro, et ce qui
      # importe ici est que la base ressemble au schéma courant.
      - name: Poser le schéma
        run: |
          npx prisma migrate diff --from-empty --to-schema ./prisma/schema.prisma --script > /tmp/schema.sql
          psql "$DATABASE_URL" -q -f /tmp/schema.sql

      - run: npm run build

      - name: Installer le navigateur
        run: npx playwright install --with-deps chromium

      - name: Parcours
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-parcours
          path: |
            playwright-report/
            test-results/
          retention-days: 7
