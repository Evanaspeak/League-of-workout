# Les tests ne servent que s'ils tournent sans qu'on y pense.
#
# Ils sont conçus pour ne dépendre de rien : base et session sont doublées,
# donc aucune variable d'environnement, aucun PostgreSQL, aucun secret. Le
# poste de travail et le serveur d'intégration exécutent exactement la même
# commande.
name: Tests

# Une exécution par changement, pas deux.
#
# Le travail se fait sur une branche puis se fusionne aussitôt dans `main` :
# avec `branches: ["**"]`, chaque changement déclenchait deux exécutions, donc
# deux courriels quand ça cassait. Vingt-cinq versions rouges d'affilée en ont
# fait cinquante en une nuit. `main` et les demandes de fusion suffisent, et
# `workflow_dispatch` reste là pour éprouver une branche à la main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une poussée qui en suit une autre de près annule la précédente : une
# exécution annulée n'envoie pas de courriel, et le code qu'elle testait est
# de toute façon contenu dans la suivante.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --ci

  # Les parcours, découpés sur six runners d'un worker chacun.
  #
  # Ils tenaient sur un seul, à deux workers, et prenaient dix minutes — 69 %
  # d'un travail qui en durait quatorze.
  #
  # Un worker par runner, et non deux : quatre workers sur une SEULE machine
  # avaient déjà été essayés et refusés, et le premier découpage a rendu le
  # même échec. Un Chromium, un processus de test et le serveur Next qui hache
  # en bcrypt coût 12 ne se partagent pas quatre cœurs sans que la CONNEXION
  # perde sa place dans la file — et c'est toujours elle qui meurt, jamais ce
  # que le test éprouvait. Un runner par worker, c'est une machine entière
  # chacun : la contention disparaît au lieu d'être arbitrée.
  #
  # Six et non quatre, et c'est l'ÉQUILIBRE qui l'a décidé, pas le total :
  # Playwright découpe au nombre de tests, qui ne dit rien de la durée. À
  # quatre, `parcours.spec.ts` — deux trajets complets, sur poste et sur
  # téléphone — partageait son tronçon avec `social.spec.ts`, qui fait jouer
  # trois comptes : 7 min 35 pendant que les trois autres finissaient en moins
  # de deux minutes et demie. À six, les deux se séparent.
  #
  # Et le dépôt est PUBLIC, donc aucune de ces minutes n'est facturée. Sur un
  # dépôt privé l'arbitrage serait inverse — on paierait neuf préparations au
  # lieu de deux pour gagner du temps d'attente.
  parcours:
    runs-on: ubuntu-latest
    strategy:
      # Sans quoi un tronçon qui casse annule l'autre, et on perd la moitié de
      # ce qu'on était venu apprendre.
      fail-fast: false
      matrix:
        troncon: [1, 2, 3, 4, 5, 6]
    env:
      DATABASE_URL: postgresql://wow:wow@localhost:5432/wow
      DIRECT_URL: postgresql://wow:wow@localhost:5432/wow
      AUTH_SECRET: integration-continue-non-secret-0000000000
      AUTH_URL: http://127.0.0.1:3311
      NEXTAUTH_URL: http://127.0.0.1:3311
      AUTH_TRUST_HOST: "true"
      E2E_PORT: "3311"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow
          POSTGRES_PASSWORD: wow
          POSTGRES_DB: wow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparer

      - name: Parcours
        run: npx playwright test --project=chromium --shard=${{ matrix.troncon }}/6

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-parcours-${{ matrix.troncon }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # `bareme-gele` écrit les ratios GLOBAUX dans `SystemConfig`.
  #
  # Il vivait dans un projet Playwright qui attendait la fin de tous les
  # autres : lancé à côté d'eux, il changeait le barème sous leurs pieds et
  # l'échec tombait n'importe où sauf chez lui. Sur son propre runner il a sa
  # PROPRE base : la protection devient structurelle au lieu d'être un ordre
  # d'exécution, et `--no-deps` évite de rejouer les 200 autres parcours pour
  # satisfaire une dépendance qui ne sert plus ici.
  bareme:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://wow:wow@localhost:5432/wow
      DIRECT_URL: postgresql://wow:wow@localhost:5432/wow
      AUTH_SECRET: integration-continue-non-secret-0000000000
      AUTH_URL: http://127.0.0.1:3311
      NEXTAUTH_URL: http://127.0.0.1:3311
      AUTH_TRUST_HOST: "true"
      E2E_PORT: "3311"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow
          POSTGRES_PASSWORD: wow
          POSTGRES_DB: wow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparer

      - name: Barème gelé
        run: npx playwright test --project=bareme --no-deps

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-bareme
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # L'accessibilité se mesure, elle ne se devine pas.
  #
  # Elle vivait à la suite des parcours, sur le même runner, et ajoutait ses
  # deux minutes quarante au chemin critique alors qu'elle ne dépend d'aucun
  # d'eux : elle ouvre des pages publiques sur un serveur qu'elle démarre
  # elle-même. Sans jeton de session elle s'en tient à ces pages-là, ce qui
  # suffit — les écrans connectés partagent les mêmes composants et les mêmes
  # couleurs.
  accessibilite:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://wow:wow@localhost:5432/wow
      DIRECT_URL: postgresql://wow:wow@localhost:5432/wow
      AUTH_SECRET: integration-continue-non-secret-0000000000
      AUTH_URL: http://127.0.0.1:3311
      NEXTAUTH_URL: http://127.0.0.1:3311
      AUTH_TRUST_HOST: "true"
      E2E_PORT: "3311"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow
          POSTGRES_PASSWORD: wow
          POSTGRES_DB: wow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparer

      - name: Accessibilité
        run: |
          npx next start -p 3311 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3311/cgu > /dev/null && break
            sleep 1
          done
          npm run a11y
