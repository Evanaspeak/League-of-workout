# Sauvegarde de la base, et vérification qu'elle se restaure.
#
# Le plan gratuit Neon ne garantit aucune sauvegarde. Aujourd'hui, une fausse
# manœuvre ou une suppression de projet efface tout sans recours, et une seule
# personne a accès au compte.
#
# Ce qui compte ici n'est pas le fichier produit : c'est la restauration. Une
# sauvegarde que personne n'a jamais restaurée n'est pas une sauvegarde, c'est
# une croyance. Chaque exécution restaure donc le fichier dans un PostgreSQL
# neuf et compare le nombre de lignes, table par table, avec la source. Sans
# ce contrôle, on découvrirait le jour de l'accident que les dumps étaient
# vides depuis six mois.
name: Sauvegarde

on:
  schedule:
    # 3 h 17 UTC : à l'écart des heures rondes, où tout le monde planifie.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  sauvegarder:
    runs-on: ubuntu-latest
    services:
      restauration:
        # La version doit être au moins celle du serveur source : un
        # `pg_restore` d'un dump 18 dans un serveur 16 échoue. Un service ne
        # peut pas lire une variable de job, d'où le nombre écrit ici — et
        # l'étape « Vérifier les versions » qui refuse bruyamment le jour où
        # Neon prend de l'avance, en disant quel nombre changer.
        image: postgres:18
        env:
          POSTGRES_USER: verif
          POSTGRES_PASSWORD: verif
          POSTGRES_DB: verif
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SOURCE: ${{ secrets.DATABASE_URL }}
      CIBLE: postgresql://verif:verif@localhost:5432/verif
      PASSE: ${{ secrets.SAUVEGARDE_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v4

      # Des secrets absents ne sont pas une sauvegarde qui échoue : c'est une
      # sauvegarde qui n'a pas encore été configurée. La distinction compte,
      # parce qu'échouer là-dessus envoie un courriel par jour pour redire une
      # chose déjà connue — et une alerte qu'on reçoit tous les jours finit
      # dans un filtre, avec les vraies.
      #
      # En revanche, une sauvegarde CONFIGURÉE qui échoue continue d'échouer
      # bruyamment : une sauvegarde qui n'existe pas doit se voir.
      - name: Vérifier les secrets
        id: secrets
        run: |
          set -uo pipefail
          if [ -z "$SOURCE" ] || [ -z "$PASSE" ]; then
            echo "::warning::DATABASE_URL ou SAUVEGARDE_PASSPHRASE absent — aucune sauvegarde. Rien n'est protégé tant qu'ils ne sont pas posés."
            echo "prets=non" >> "$GITHUB_OUTPUT"
          else
            echo "prets=oui" >> "$GITHUB_OUTPUT"
          fi

      # Les outils client doivent avoir la version du serveur : un pg_dump 16
      # refuse une base 18, et c'est exactement ce qui s'est produit le jour
      # où Neon est passé en 18. Le numéro n'est donc plus écrit à la main :
      # il se demande au serveur.
      #
      # `psql` traverse les versions sans se plaindre — seul `pg_dump` refuse.
      # Celui préinstallé sur le runner suffit donc à lire la version avant
      # d'installer le bon client.
      - name: Lire la version du serveur
        id: version
        if: steps.secrets.outputs.prets == 'oui'
        run: |
          set -euo pipefail
          # `server_version_num` vaut 180006 pour PostgreSQL 18.6. La division
          # donne la majeure quel que soit le nombre de chiffres, là où un
          # `cut -c1-2` se tromperait le jour d'une version à trois chiffres.
          brut=$(psql "$SOURCE" -At -c "SHOW server_version_num")
          case "$brut" in
            ''|*[!0-9]*) echo "::error::Version du serveur illisible : « $brut »"; exit 1 ;;
          esac
          majeur=$(( brut / 10000 ))
          echo "Serveur PostgreSQL $majeur"
          echo "majeur=$majeur" >> "$GITHUB_OUTPUT"

      # Le conteneur de restauration, lui, est figé dans `services` : il ne
      # peut pas suivre. On refuse donc bruyamment plutôt que de produire un
      # dump que la vérification ne saura pas restaurer.
      - name: Vérifier que la restauration saura relire ce dump
        if: steps.secrets.outputs.prets == 'oui'
        env:
          MAJEUR: ${{ steps.version.outputs.majeur }}
          RESTAURATION: "18"
        run: |
          set -euo pipefail
          if [ "$MAJEUR" -gt "$RESTAURATION" ]; then
            echo "::error::Le serveur est en PostgreSQL $MAJEUR et le conteneur de restauration en $RESTAURATION. Mettre « image: postgres:$MAJEUR » dans ce fichier."
            exit 1
          fi

      - name: Installer le client PostgreSQL de la version du serveur
        if: steps.secrets.outputs.prets == 'oui'
        env:
          MAJEUR: ${{ steps.version.outputs.majeur }}
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$MAJEUR"
          pg_dump --version

      - name: Exporter
        if: steps.secrets.outputs.prets == 'oui'
        run: |
          set -euo pipefail
          mkdir -p /tmp/sauvegarde
          # Format « custom » : compressé, et restaurable table par table.
          # `--no-owner` et `--no-privileges` : les rôles de Neon n'existent
          # pas ailleurs, et une restauration doit pouvoir se faire n'importe où.
          pg_dump --format=custom --no-owner --no-privileges \
            --file=/tmp/sauvegarde/base.dump "$SOURCE"
          ls -l /tmp/sauvegarde/base.dump

      - name: Restaurer dans une base neuve
        if: steps.secrets.outputs.prets == 'oui'
        run: |
          set -euo pipefail
          pg_restore --dbname="$CIBLE" --no-owner --no-privileges \
            --exit-on-error /tmp/sauvegarde/base.dump

      - name: Comparer la source et la restauration, table par table
        if: steps.secrets.outputs.prets == 'oui'
        run: |
          set -euo pipefail
          # Le comptage se fait sur les tables réellement présentes à la
          # source : coder la liste en dur la ferait diverger du schéma au
          # premier modèle ajouté, sans que rien ne le signale.
          psql "$SOURCE" -At -c "
            SELECT tablename FROM pg_tables
            WHERE schemaname = 'public' ORDER BY tablename;" > /tmp/tables.txt

          test -s /tmp/tables.txt || { echo "::error::Aucune table à la source"; exit 1; }

          ecarts=0
          while read -r table; do
            a=$(psql "$SOURCE" -At -c "SELECT count(*) FROM \"$table\";")
            b=$(psql "$CIBLE"  -At -c "SELECT count(*) FROM \"$table\";")
            if [ "$a" != "$b" ]; then
              echo "::error::$table : $a ligne(s) à la source, $b après restauration"
              ecarts=$((ecarts + 1))
            else
              echo "$table : $a" | tee -a /tmp/comptes.txt
            fi
          done < /tmp/tables.txt

          test "$ecarts" -eq 0 || exit 1

      - name: Chiffrer
        if: steps.secrets.outputs.prets == 'oui'
        run: |
          set -euo pipefail
          # La sauvegarde contient des adresses, des empreintes de mot de passe
          # et des données de santé. Elle ne part pas en clair sur un stockage
          # que d'autres personnes du dépôt peuvent télécharger.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PASSE" \
            --output /tmp/sauvegarde/base.dump.gpg /tmp/sauvegarde/base.dump
          rm -f /tmp/sauvegarde/base.dump

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.prets == 'oui'
        with:
          name: base-${{ github.run_id }}
          path: /tmp/sauvegarde/base.dump.gpg
          # Trois mois : au-delà, une sauvegarde d'un schéma qui a changé
          # deux fois ne se restaure plus utilement.
          retention-days: 90
          if-no-files-found: error

      # Le vert ne disait pas ce qui s'était passé.
      #
      # Une exécution qui saute tout faute de secrets et une exécution qui
      # sauvegarde et restaure rendaient exactement la même pastille verte.
      # C'est ainsi que la sauvegarde a pu ne rien produire pendant des
      # semaines sans que personne ne le remarque : il n'y avait rien à
      # remarquer.
      #
      # L'absence de secrets ne doit pas être un échec — un échec quotidien
      # se filtre, et on ne le lit plus le jour où il compte. Mais elle doit
      # se VOIR. Le résumé s'affiche sur la page de l'exécution, sans envoyer
      # le moindre courriel.
      - name: Dire ce qui a été fait
        if: always()
        env:
          PRETS: ${{ steps.secrets.outputs.prets }}
        run: |
          set -uo pipefail
          if [ "$PRETS" = "oui" ]; then
            {
              echo "## Sauvegarde produite"
              echo
              echo "Base exportée, restaurée dans un PostgreSQL neuf, et comparée table par table."
              echo
              echo "| table | lignes |"
              echo "|---|---|"
              # Le comptage vient de l'étape de comparaison, qui l'a déjà écrit.
              sed -n 's/^\(.*\) : \([0-9]\+\)$/| \1 | \2 |/p' /tmp/comptes.txt 2>/dev/null || true
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Aucune sauvegarde"
              echo
              echo "\`DATABASE_URL\` ou \`SAUVEGARDE_PASSPHRASE\` manque dans les secrets du dépôt."
              echo "**Rien n'est protégé tant qu'ils ne sont pas posés.**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
